\* TLC configuration. The fixed protocol: every property must hold.
SPECIFICATION Spec
CONSTANTS
    Peers = {p1, p2}
    Tokens = {t1, t2}
    MsgIds = {m1}
    MaxLog = 4
    ClampPull = TRUE
    StrictInvites = TRUE
INVARIANTS
    TypeOK
    Contiguous
    AppliedInMembership
    NoPreJoinReads
    NoPostLeaveReads
    UniqueIds
    SingleUseInvites
PROPERTIES
    AppendOnly
    CatchUp
