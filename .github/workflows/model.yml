# Model-check the channel protocol (spec/model) with TLC on changes to the model, and weekly.
name: model
on:
  push:
    branches: [main]
    paths: ['spec/model/**', 'scripts/check-model.sh', '.github/workflows/model.yml']
  pull_request:
    paths: ['spec/model/**', 'scripts/check-model.sh', '.github/workflows/model.yml']
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: scripts/check-model.sh
