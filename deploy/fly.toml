# fly launch --copy-config --dockerfile deploy/Dockerfile --no-deploy
# fly volumes create intertie_state --size 1
# fly secrets set SLACK_CLIENT_ID=… SLACK_CLIENT_SECRET=… SLACK_SIGNING_SECRET=… SLACK_TOKEN_KEY=$(openssl rand -base64 32)
# fly certs add connect.vendor.example && fly certs add '*.connect.vendor.example'   (each workspace is <team>.connect.vendor.example)
# fly deploy
app = "intertie-host"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  INTERTIE_PUBLIC_BASE = "https://connect.vendor.example"
  INTERTIE_ORG_SUFFIX = "connect.vendor.example"

[[mounts]]
  source = "intertie_state"
  destination = "/state"

[http_service]
  internal_port = 8700
  force_https = true
  auto_stop_machines = "off"   # always on: Slack and peers deliver at any time
  min_machines_running = 1
